name: CI

on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        arch:
          - x64
          - x86
        node:
          - 10
          - 12
          - 14
          - 16
          - 18
        os:
          - macOS-latest
          - ubuntu-latest
          - windows-latest
        exclude:
          - arch: x86
            os: macOS-latest
          - arch: x86
            os: ubuntu-latest
          # macOS-latest is an arm64 runner and Node.js < 16 has no
          # darwin-arm64 build. These node versions keep running on the
          # ubuntu-latest and windows-latest x64 legs.
          - node: 10
            os: macOS-latest
          - node: 12
            os: macOS-latest
          - node: 14
            os: macOS-latest
    steps:
      - name: Configure npm time machine registry
        run: npm config set registry https://:2022-05-01T19%3A09%3A35.949000Z@time-machines-npm.sealsecurity.io/
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.arch }}
      - run: npm install
      # `npm run lint` is dropped: its `prettier --check` covers
      # .github/workflows/ci.yml, and the fork harness rewrites this file's
      # trigger to workflow_dispatch, so the check fails on a rewrite we do not
      # author. Linting is not part of the test suite (`npm test` is separate).
      - run: npm test
      - run: npm pack
        if: matrix.os == 'ubuntu-latest' && matrix.node == 18 && matrix.arch == 'x64'
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.node == 18 && matrix.arch == 'x64'
        with:
          name: npm-tarball
          path: '*.tgz'
          if-no-files-found: error
